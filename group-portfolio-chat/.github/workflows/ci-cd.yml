name: CI/CD

on:
  push: { branches: [main] }
  pull_request: { branches: [main] }

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: portfolio }
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/portfolio
      PORT: "3001"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install & build
        run: npm run build
      - name: Type check (tsc --noEmit)
        run: npm --prefix backend run check
      - name: Unit tests (guardrails)
        run: npm --prefix backend test
      - name: Smoke test (start server + hit API)
        run: |
          npm --prefix backend start &
          sleep 5
          curl -sf http://localhost:3001/api/health
          curl -sf http://localhost:3001/api/portfolio | grep -q '"members"'

  deploy:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
    steps:
      - name: Trigger Render deploy
        run: |
          if [ -z "$HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK_URL is not set - skipping deploy"
            exit 0
          fi
          curl -fsS -X POST "$HOOK"
