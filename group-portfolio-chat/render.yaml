# Render Blueprint: deploy เว็บ + Postgres ฟรี
services:
  - type: web
    name: group-portfolio-chat
    runtime: node
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: portfolio-db, property: connectionString }
      - key: DATABASE_SSL
        value: "true"
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: gemini-3.5-flash-lite
databases:
  - name: portfolio-db
    plan: free
# ตั้ง LLM_BASE_URL เพิ่มใน Render ถ้าไม่ใช้ Gemini (ค่าเริ่มต้นคือ Gemini OpenAI-compatible)
